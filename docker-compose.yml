
services:
  ml:
    build:
      context: ./ml
    container_name: bairroemdia-ml
    ports:
      - "8000:8000"
    environment:
      MODEL_PATH: /app/model/random_forest.joblib
    volumes:
      - ./ml/model:/app/model
    restart: unless-stopped

